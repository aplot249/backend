<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Work Content Statistics Form</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            height: 100dvh;          /* 移动端地址栏收起/展开时高度自适应 */
            overflow: hidden;        /* 页面本身不出现滚动条 */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* ---------- 卡片：固定占满可视高度，内部用 flex 分配，绝不外溢 ---------- */
        .card {
            background: #fff;
            width: 100%;
            max-width: 460px;
            height: 100%;
            max-height: 100%;
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .head { flex: none; margin-bottom: 10px; }
        .card h1 { font-size: 18px; color: #333; line-height: 1.25; }
        .card .subtitle { font-size: 12px; color: #999; margin-top: 2px; }

        form {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        /* ---------- 主体：手机单列 / 电脑双列 ---------- */
        .grid {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .field { display: flex; flex-direction: column; min-height: 0; }
        .field > label {
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .field label .required { color: #e74c3c; }
        .field label .optional { color: #aaa; font-weight: 400; }

        .field input, .field textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 16px;         /* >=16px，iOS 聚焦时不会自动放大页面 */
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .field input:focus, .field textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        .field textarea { resize: none; min-height: 54px; flex: none; }

        /* 姓名 + 自动补全 */
        .field-name { flex: none; position: relative; }
        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-top: 4px;
            max-height: 34vh;
            overflow-y: auto;
            z-index: 20;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            display: none;
        }
        .suggestions .item { padding: 9px 12px; cursor: pointer; font-size: 14px; color: #333; }
        .suggestions .item:hover { background: #f0f2ff; }
        .suggestions .empty { padding: 9px 12px; font-size: 13px; color: #aaa; }

        /* 项目：条目再多也只在框内滚动，页面不出现滚动条 */
        .field-project { flex: 1; min-height: 0; }
        .project-options {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 6px;
            padding: 2px;
            scrollbar-width: thin;
        }
        .project-options::-webkit-scrollbar { width: 6px; }
        .project-options::-webkit-scrollbar-thumb { background: #d7d9e8; border-radius: 3px; }
        .project-options .option {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 13px;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            background: #fff;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .project-options .option:hover { border-color: #667eea; color: #667eea; }
        .project-options .option.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-color: transparent;
        }
        .project-options .loading { font-size: 13px; color: #aaa; }

        /* ---------- 工卡上传 ---------- */
        .field-upload { flex: none; display: flex; flex-direction: column; }
        .upload-box {
            flex: 1;
            min-height: 74px;
            border: 2px dashed #d5d8e8;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: #fafbff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .upload-box:hover, .upload-box.dragover { border-color: #667eea; background: #f2f4ff; }
        .upload-box .icon { width: 26px; height: 26px; color: #8b90c9; }
        .upload-box .title { font-size: 13px; color: #555; }
        .upload-box .title b { color: #667eea; }
        .upload-box .hint { font-size: 11px; color: #aaa; }

        .upload-preview {
            display: none;
            flex: 1;
            min-height: 0;
            align-items: center;
            gap: 10px;
            border: 1px solid #e6e8f2;
            border-radius: 12px;
            padding: 10px;
            background: #fafbff;
        }
        .upload-preview img {
            width: 62px;
            height: 62px;
            object-fit: cover;
            border-radius: 8px;
            background: #eee;
            flex: none;
        }
        .upload-preview .info { flex: 1; min-width: 0; }
        .upload-preview .info .fname {
            font-size: 13px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .upload-preview .info .fsize { font-size: 11px; color: #999; margin-top: 3px; }
        .upload-preview .info .replace {
            display: inline-block;
            font-size: 12px;
            color: #667eea;
            margin-top: 5px;
            cursor: pointer;
        }
        .upload-preview .remove {
            flex: none;
            border: none;
            background: #fdecea;
            color: #e74c3c;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }
        .upload-preview .remove:hover { background: #fbd7d2; }

        /* ---------- 底部：提交按钮 + 提示（提示浮层，不占高度） ---------- */
        .foot { flex: none; position: relative; margin-top: 10px; }
        button[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        button[type="submit"]:hover { opacity: 0.92; }
        button[type="submit"]:active { transform: scale(0.99); }
        button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }

        .message {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 100%;
            margin-bottom: 8px;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.4;
            display: none;
            z-index: 30;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }
        .message.success { background: #e8f8ef; color: #27ae60; display: block; }
        .message.error { background: #fdecea; color: #e74c3c; display: block; }

        /* ---------- 矮屏（小手机 / 横屏）再压缩 ---------- */
        @media (max-height: 620px) {
            .card { padding: 12px; }
            .head { margin-bottom: 8px; }
            .card h1 { font-size: 16px; }
            .card .subtitle { display: none; }
            .grid { gap: 8px; }
            .field textarea { min-height: 44px; }
            .upload-box { min-height: 62px; padding: 8px; }
            .upload-box .hint { display: none; }
            .foot { margin-top: 8px; }
            button[type="submit"] { padding: 10px; }
        }

        /* ---------- 电脑端：双列铺满，不拉长成竖条 ---------- */
        @media (min-width: 860px) {
            .card {
                max-width: 940px;
                max-height: min(100%, 720px);
                padding: 22px;
                border-radius: 16px;
            }
            .head { margin-bottom: 16px; }
            .card h1 { font-size: 22px; }
            .card .subtitle { font-size: 14px; }
            .grid {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(260px, 320px);
                grid-template-rows: auto minmax(0, 1fr) auto;
                grid-template-areas:
                    "name    upload"
                    "project upload"
                    "remark  upload";
                gap: 14px 24px;
            }
            .field-name { grid-area: name; }
            .field-project { grid-area: project; }
            .field-upload { grid-area: upload; }
            .field-remark { grid-area: remark; }
            .field textarea { min-height: 92px; }
            .project-options { gap: 8px; }
            .project-options .option { font-size: 14px; padding: 8px 14px; }
            /* 上传区占满整列高度，预览图自适应 */
            .upload-box .icon { width: 40px; height: 40px; }
            .upload-box .title { font-size: 15px; }
            .upload-box .hint { font-size: 12px; }
            .upload-preview img { width: 100%; height: auto; max-height: 190px; object-fit: contain; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="head">
            <h1>Work Attendance Card Statistics</h1>
            <p class="subtitle">Please fill in the information below and submit</p>
        </div>

        <form id="form">
            <div class="grid">
                <div class="field field-name">
                    <label>Name <span class="required">*</span></label>
                    <input type="text" id="name" autocomplete="off" autocapitalize="characters"
                           spellcheck="false" placeholder="Type your name to search">
                    <div class="suggestions" id="nameSuggest"></div>
                </div>

                <div class="field field-project">
                    <label>Project <span class="required">*</span></label>
                    <div class="project-options" id="projectOptions">
                        <span class="loading">Loading...</span>
                    </div>
                </div>

                <div class="field field-upload">
                    <label>Attendance Card Image <span class="required">*</span></label>
                    <div class="upload-box" id="uploadBox">
                        <svg class="icon" viewBox="0 0 48 48" fill="none" stroke="currentColor"
                             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="10" width="40" height="28" rx="4"></rect>
                            <circle cx="16" cy="22" r="4.5"></circle>
                            <path d="M9 33c1.5-4 4-6 7-6s5.5 2 7 6"></path>
                            <path d="M29 20h9M29 27h9"></path>
                        </svg>
                        <div class="title">Tap to <b>upload your attendance card</b></div>
                        <div class="hint">jpg / png / webp, up to 10MB</div>
                    </div>
                    <div class="upload-preview" id="uploadPreview">
                        <img id="previewImg" alt="work card preview">
                        <div class="info">
                            <div class="fname" id="previewName"></div>
                            <div class="fsize" id="previewSize"></div>
                            <span class="replace" id="replaceBtn">Choose another image</span>
                        </div>
                        <button type="button" class="remove" id="removeBtn">Remove</button>
                    </div>
                    <input type="file" id="cardImage" name="card_image" accept="image/*" hidden>
                </div>

                <div class="field field-remark">
                    <label>Work Content <span class="optional">(optional)</span></label>
                    <textarea id="remark" placeholder="Briefly describe your work content"></textarea>
                </div>
            </div>

            <div class="foot">
                <div class="message" id="message"></div>
                <button type="submit" id="submitBtn">Submit</button>
            </div>
        </form>
    </div>

    <script>
        function debounce(fn, delay) {
            let timer;
            return function () {
                clearTimeout(timer);
                timer = setTimeout(fn, delay);
            };
        }

        function setupAutocomplete(inputId, suggestId, url, onSelect) {
            const input = document.getElementById(inputId);
            const box = document.getElementById(suggestId);

            function render(items) {
                box.innerHTML = "";
                if (!items.length) {
                    const div = document.createElement("div");
                    div.className = "empty";
                    div.textContent = "No matches found";
                    box.appendChild(div);
                } else {
                    items.forEach(function (item) {
                        const div = document.createElement("div");
                        div.className = "item";
                        div.textContent = item;
                        div.addEventListener("mousedown", function (e) {
                            e.preventDefault();
                            input.value = item;
                            box.style.display = "none";
                            if (onSelect) onSelect(item);
                        });
                        box.appendChild(div);
                    });
                }
                box.style.display = "block";
            }

            const search = debounce(function () {
                const q = input.value.trim();
                if (!q) { box.style.display = "none"; return; }
                fetch(url + "?q=" + encodeURIComponent(q))
                    .then(function (r) { return r.json(); })
                    .then(function (data) { render(data.results || []); })
                    .catch(function () { box.style.display = "none"; });
            }, 250);

            input.addEventListener("input", search);
            input.addEventListener("focus", function () {
                if (input.value.trim()) search();
            });
            document.addEventListener("click", function (e) {
                if (!input.contains(e.target) && !box.contains(e.target)) {
                    box.style.display = "none";
                }
            });
        }

        setupAutocomplete("name", "nameSuggest", "/api/search-name/");

        // Project: directly show all options for selection
        let selectedProject = "";
        const projectOptions = document.getElementById("projectOptions");

        function renderProjects(items) {
            projectOptions.innerHTML = "";
            if (!items.length) {
                const span = document.createElement("span");
                span.className = "loading";
                span.textContent = "No projects yet. Please import them in the admin panel.";
                projectOptions.appendChild(span);
                return;
            }
            items.forEach(function (item) {
                const div = document.createElement("div");
                div.className = "option";
                div.textContent = item;
                div.addEventListener("click", function () {
                    selectedProject = item;
                    projectOptions.querySelectorAll(".option").forEach(function (o) {
                        o.classList.remove("selected");
                    });
                    div.classList.add("selected");
                });
                projectOptions.appendChild(div);
            });
        }

        fetch("/api/list-project/")
            .then(function (r) { return r.json(); })
            .then(function (data) { renderProjects(data.results || []); })
            .catch(function () {
                projectOptions.innerHTML = "";
                const span = document.createElement("span");
                span.className = "loading";
                span.textContent = "Failed to load. Please refresh and try again.";
                projectOptions.appendChild(span);
            });

        // 工卡图片上传
        const MAX_IMAGE_SIZE = 10 * 1024 * 1024;
        const uploadBox = document.getElementById("uploadBox");
        const uploadPreview = document.getElementById("uploadPreview");
        const cardInput = document.getElementById("cardImage");
        const previewImg = document.getElementById("previewImg");
        const previewName = document.getElementById("previewName");
        const previewSize = document.getElementById("previewSize");
        let previewUrl = "";

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + " B";
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
            return (bytes / 1024 / 1024).toFixed(2) + " MB";
        }

        function clearImage() {
            cardInput.value = "";
            if (previewUrl) {
                URL.revokeObjectURL(previewUrl);
                previewUrl = "";
            }
            previewImg.removeAttribute("src");
            uploadPreview.style.display = "none";
            uploadBox.style.display = "";
        }

        function showImage(file) {
            if (!file) return;
            if (!file.type || file.type.indexOf("image/") !== 0) {
                showMessage("Please choose an image file", "error");
                return;
            }
            if (file.size > MAX_IMAGE_SIZE) {
                showMessage("Image is too large. Please choose one smaller than 10MB.", "error");
                clearImage();
                return;
            }
            if (previewUrl) URL.revokeObjectURL(previewUrl);
            previewUrl = URL.createObjectURL(file);
            previewImg.src = previewUrl;
            previewName.textContent = file.name;
            previewSize.textContent = formatSize(file.size);
            uploadBox.style.display = "none";
            uploadPreview.style.display = "flex";
            message.className = "message";
        }

        uploadBox.addEventListener("click", function () { cardInput.click(); });
        document.getElementById("replaceBtn").addEventListener("click", function () { cardInput.click(); });
        document.getElementById("removeBtn").addEventListener("click", function () { clearImage(); });

        cardInput.addEventListener("change", function () {
            const file = cardInput.files && cardInput.files[0];
            if (file) showImage(file);
        });

        ["dragenter", "dragover"].forEach(function (type) {
            uploadBox.addEventListener(type, function (e) {
                e.preventDefault();
                uploadBox.classList.add("dragover");
            });
        });
        ["dragleave", "drop"].forEach(function (type) {
            uploadBox.addEventListener(type, function (e) {
                e.preventDefault();
                uploadBox.classList.remove("dragover");
            });
        });
        uploadBox.addEventListener("drop", function (e) {
            const files = e.dataTransfer && e.dataTransfer.files;
            if (files && files.length) {
                cardInput.files = files;
                showImage(files[0]);
            }
        });

        const form = document.getElementById("form");
        const message = document.getElementById("message");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            const name = document.getElementById("name").value.trim();
            const project = selectedProject;
            const remark = document.getElementById("remark").value.trim();
            const cardFile = cardInput.files && cardInput.files[0];

            if (!name || !project) {
                showMessage("Please fill in your name and select a project", "error");
                return;
            }
            if (!cardFile) {
                showMessage("Please upload your attendance card image", "error");
                return;
            }
            if (cardFile.size > MAX_IMAGE_SIZE) {
                showMessage("Image is too large. Please choose one smaller than 10MB.", "error");
                return;
            }

            const formData = new FormData();
            formData.append("name", name);
            formData.append("project", project);
            formData.append("remark", remark);
            formData.append("card_image", cardFile);

            submitBtn.disabled = true;
            submitBtn.textContent = "Submitting...";

            fetch("/api/submit/", {
                method: "POST",
                body: formData
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.ok) {
                        showMessage(data.message || "Submitted successfully", "success");
                        form.reset();
                        selectedProject = "";
                        projectOptions.querySelectorAll(".option").forEach(function (o) {
                            o.classList.remove("selected");
                        });
                        clearImage();
                    } else {
                        showMessage(data.message || "Submission failed", "error");
                    }
                })
                .catch(function () { showMessage("Network error. Please try again.", "error"); })
                .finally(function () {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Submit";
                });
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }
    </script>
</body>
</html>
