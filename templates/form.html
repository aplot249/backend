<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Content Statistics Form</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #fff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
        .card h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 6px;
        }
        .card .subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 28px;
        }
        .field { margin-bottom: 22px; position: relative; }
        .field label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .field label .required { color: #e74c3c; }
        .field label .optional { color: #aaa; font-weight: 400; }
        .field input, .field textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .field input:focus, .field textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        .field textarea { resize: vertical; min-height: 100px; }
        .project-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .project-options .option {
            padding: 8px 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            background: #fff;
        }
        .project-options .option:hover { border-color: #667eea; color: #667eea; }
        .project-options .option.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-color: transparent;
        }
        .project-options .loading {
            font-size: 13px;
            color: #aaa;
        }
        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-top: 4px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            display: none;
        }
        .suggestions .item {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
        }
        .suggestions .item:hover { background: #f0f2ff; }
        .suggestions .empty {
            padding: 10px 14px;
            font-size: 13px;
            color: #aaa;
        }
        /* 工卡上传 */
        .upload-box {
            border: 2px dashed #d5d8e8;
            border-radius: 12px;
            padding: 26px 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: #fafbff;
        }
        .upload-box:hover, .upload-box.dragover {
            border-color: #667eea;
            background: #f2f4ff;
        }
        .upload-box .icon {
            width: 38px;
            height: 38px;
            margin: 0 auto 10px;
            display: block;
            color: #8b90c9;
        }
        .upload-box .title {
            font-size: 14px;
            color: #555;
            margin-bottom: 4px;
        }
        .upload-box .title b { color: #667eea; }
        .upload-box .hint {
            font-size: 12px;
            color: #aaa;
        }
        .upload-preview {
            display: none;
            align-items: center;
            gap: 14px;
            border: 1px solid #e6e8f2;
            border-radius: 12px;
            padding: 12px;
            background: #fafbff;
        }
        .upload-preview img {
            width: 84px;
            height: 84px;
            object-fit: cover;
            border-radius: 8px;
            background: #eee;
            flex: none;
        }
        .upload-preview .info {
            flex: 1;
            min-width: 0;
        }
        .upload-preview .info .fname {
            font-size: 14px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .upload-preview .info .fsize {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .upload-preview .info .replace {
            display: inline-block;
            font-size: 12px;
            color: #667eea;
            margin-top: 6px;
            cursor: pointer;
        }
        .upload-preview .remove {
            flex: none;
            border: none;
            background: #fdecea;
            color: #e74c3c;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }
        .upload-preview .remove:hover { background: #fbd7d2; }
        button[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        button[type="submit"]:hover { opacity: 0.92; }
        button[type="submit"]:active { transform: scale(0.98); }
        button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
        .message {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .message.success { background: #e8f8ef; color: #27ae60; display: block; }
        .message.error { background: #fdecea; color: #e74c3c; display: block; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Work Content Statistics</h1>
        <p class="subtitle">Please fill in the information below and submit</p>
        <form id="form">
            <div class="field">
                <label>Name <span class="required">*</span></label>
                <input type="text" id="name" autocomplete="off" placeholder="Type your name to search">
                <div class="suggestions" id="nameSuggest"></div>
            </div>
            <div class="field">
                <label>Project <span class="required">*</span></label>
                <div class="project-options" id="projectOptions">
                    <span class="loading">Loading...</span>
                </div>
            </div>
            <div class="field">
                <label>Work Card Image <span class="required">*</span></label>
                <div class="upload-box" id="uploadBox">
                    <svg class="icon" viewBox="0 0 48 48" fill="none" stroke="currentColor"
                         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="10" width="40" height="28" rx="4"></rect>
                        <circle cx="16" cy="22" r="4.5"></circle>
                        <path d="M9 33c1.5-4 4-6 7-6s5.5 2 7 6"></path>
                        <path d="M29 20h9M29 27h9"></path>
                    </svg>
                    <div class="title">Tap to <b>upload your attendance card</b></div>
                    <div class="hint">jpg / png / webp, up to 10MB</div>
                </div>
                <div class="upload-preview" id="uploadPreview">
                    <img id="previewImg" alt="work card preview">
                    <div class="info">
                        <div class="fname" id="previewName"></div>
                        <div class="fsize" id="previewSize"></div>
                        <span class="replace" id="replaceBtn">Choose another image</span>
                    </div>
                    <button type="button" class="remove" id="removeBtn">Remove</button>
                </div>
                <input type="file" id="cardImage" name="card_image" accept="image/*" hidden>
            </div>
            <div class="field">
                <label>Work Content <span class="optional">(optional)</span></label>
                <textarea id="remark" placeholder="Briefly describe your work content"></textarea>
            </div>
            <button type="submit" id="submitBtn">Submit</button>
            <div class="message" id="message"></div>
        </form>
    </div>

    <script>
        function debounce(fn, delay) {
            let timer;
            return function () {
                clearTimeout(timer);
                timer = setTimeout(fn, delay);
            };
        }

        function setupAutocomplete(inputId, suggestId, url, onSelect) {
            const input = document.getElementById(inputId);
            const box = document.getElementById(suggestId);

            function render(items) {
                box.innerHTML = "";
                if (!items.length) {
                    const div = document.createElement("div");
                    div.className = "empty";
                    div.textContent = "No matches found";
                    box.appendChild(div);
                } else {
                    items.forEach(function (item) {
                        const div = document.createElement("div");
                        div.className = "item";
                        div.textContent = item;
                        div.addEventListener("mousedown", function (e) {
                            e.preventDefault();
                            input.value = item;
                            box.style.display = "none";
                            if (onSelect) onSelect(item);
                        });
                        box.appendChild(div);
                    });
                }
                box.style.display = "block";
            }

            const search = debounce(function () {
                const q = input.value.trim();
                if (!q) { box.style.display = "none"; return; }
                fetch(url + "?q=" + encodeURIComponent(q))
                    .then(function (r) { return r.json(); })
                    .then(function (data) { render(data.results || []); })
                    .catch(function () { box.style.display = "none"; });
            }, 250);

            input.addEventListener("input", search);
            input.addEventListener("focus", function () {
                if (input.value.trim()) search();
            });
            document.addEventListener("click", function (e) {
                if (!input.contains(e.target) && !box.contains(e.target)) {
                    box.style.display = "none";
                }
            });
        }

        setupAutocomplete("name", "nameSuggest", "/api/search-name/");

        // Project: directly show all options for selection
        let selectedProject = "";
        const projectOptions = document.getElementById("projectOptions");

        function renderProjects(items) {
            projectOptions.innerHTML = "";
            if (!items.length) {
                const span = document.createElement("span");
                span.className = "loading";
                span.textContent = "No projects yet. Please import them in the admin panel.";
                projectOptions.appendChild(span);
                return;
            }
            items.forEach(function (item) {
                const div = document.createElement("div");
                div.className = "option";
                div.textContent = item;
                div.addEventListener("click", function () {
                    selectedProject = item;
                    projectOptions.querySelectorAll(".option").forEach(function (o) {
                        o.classList.remove("selected");
                    });
                    div.classList.add("selected");
                });
                projectOptions.appendChild(div);
            });
        }

        fetch("/api/list-project/")
            .then(function (r) { return r.json(); })
            .then(function (data) { renderProjects(data.results || []); })
            .catch(function () {
                projectOptions.innerHTML = "";
                const span = document.createElement("span");
                span.className = "loading";
                span.textContent = "Failed to load. Please refresh and try again.";
                projectOptions.appendChild(span);
            });

        // 工卡图片上传
        const MAX_IMAGE_SIZE = 10 * 1024 * 1024;
        const uploadBox = document.getElementById("uploadBox");
        const uploadPreview = document.getElementById("uploadPreview");
        const cardInput = document.getElementById("cardImage");
        const previewImg = document.getElementById("previewImg");
        const previewName = document.getElementById("previewName");
        const previewSize = document.getElementById("previewSize");
        let previewUrl = "";

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + " B";
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
            return (bytes / 1024 / 1024).toFixed(2) + " MB";
        }

        function clearImage() {
            cardInput.value = "";
            if (previewUrl) {
                URL.revokeObjectURL(previewUrl);
                previewUrl = "";
            }
            previewImg.removeAttribute("src");
            uploadPreview.style.display = "none";
            uploadBox.style.display = "block";
        }

        function showImage(file) {
            if (!file) return;
            if (!file.type || file.type.indexOf("image/") !== 0) {
                showMessage("Please choose an image file", "error");
                return;
            }
            if (file.size > MAX_IMAGE_SIZE) {
                showMessage("Image is too large. Please choose one smaller than 10MB.", "error");
                clearImage();
                return;
            }
            if (previewUrl) URL.revokeObjectURL(previewUrl);
            previewUrl = URL.createObjectURL(file);
            previewImg.src = previewUrl;
            previewName.textContent = file.name;
            previewSize.textContent = formatSize(file.size);
            uploadBox.style.display = "none";
            uploadPreview.style.display = "flex";
            message.className = "message";
        }

        uploadBox.addEventListener("click", function () { cardInput.click(); });
        document.getElementById("replaceBtn").addEventListener("click", function () { cardInput.click(); });
        document.getElementById("removeBtn").addEventListener("click", function () { clearImage(); });

        cardInput.addEventListener("change", function () {
            const file = cardInput.files && cardInput.files[0];
            if (file) showImage(file);
        });

        ["dragenter", "dragover"].forEach(function (type) {
            uploadBox.addEventListener(type, function (e) {
                e.preventDefault();
                uploadBox.classList.add("dragover");
            });
        });
        ["dragleave", "drop"].forEach(function (type) {
            uploadBox.addEventListener(type, function (e) {
                e.preventDefault();
                uploadBox.classList.remove("dragover");
            });
        });
        uploadBox.addEventListener("drop", function (e) {
            const files = e.dataTransfer && e.dataTransfer.files;
            if (files && files.length) {
                cardInput.files = files;
                showImage(files[0]);
            }
        });

        const form = document.getElementById("form");
        const message = document.getElementById("message");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            const name = document.getElementById("name").value.trim();
            const project = selectedProject;
            const remark = document.getElementById("remark").value.trim();
            const cardFile = cardInput.files && cardInput.files[0];

            if (!name || !project) {
                showMessage("Please fill in your name and select a project", "error");
                return;
            }
            if (!cardFile) {
                showMessage("Please upload your attendance card image", "error");
                return;
            }
            if (cardFile.size > MAX_IMAGE_SIZE) {
                showMessage("Image is too large. Please choose one smaller than 10MB.", "error");
                return;
            }

            const formData = new FormData();
            formData.append("name", name);
            formData.append("project", project);
            formData.append("remark", remark);
            formData.append("card_image", cardFile);

            submitBtn.disabled = true;
            submitBtn.textContent = "Submitting...";

            fetch("/api/submit/", {
                method: "POST",
                body: formData
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.ok) {
                        showMessage(data.message || "Submitted successfully", "success");
                        form.reset();
                        selectedProject = "";
                        projectOptions.querySelectorAll(".option").forEach(function (o) {
                            o.classList.remove("selected");
                        });
                        clearImage();
                    } else {
                        showMessage(data.message || "Submission failed", "error");
                    }
                })
                .catch(function () { showMessage("Network error. Please try again.", "error"); })
                .finally(function () {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Submit";
                });
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }
    </script>
</body>
</html>
